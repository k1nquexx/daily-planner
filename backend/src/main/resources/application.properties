spring.application.name=daily-planner
server.port=8080
server.address=0.0.0.0

# Embedded persistent H2 database stored in ./data/plannerdb
spring.datasource.url=jdbc:h2:file:./data/plannerdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable Java 21 Virtual Threads for blazing fast lightweight concurrency
spring.threads.virtual.enabled=true

# Security configuration
planner.jwt.secret=DailyPlannerSuperSecretKey2026SecureTokenForSyncAndAuthWithVeryLongSafeCharacters
planner.default-pin=1234
